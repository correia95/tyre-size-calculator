    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does a tyre size like 225/45 R17 mean?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "225 is the section width in millimetres. 45 is the aspect ratio: the sidewall height is 45 percent of the width, about 101 mm. R17 is a 17 inch wheel. Overall diameter is the wheel diameter plus twice the sidewall, about 634 mm."
            }
          },
          {
            "@type": "Question",
            "name": "How much bigger or smaller can a replacement tyre be?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The common rule of thumb is to keep the new overall diameter within about 3 percent of the original. Inside that band the speedometer error stays within a few km/h and there is usually enough clearance in the wheel arch."
            }
          },
          {
            "@type": "Question",
            "name": "How do bigger tyres affect the speedometer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A tyre with a larger rolling diameter turns fewer revolutions per kilometre, so the speedometer reads low: you are travelling faster than it shows, and the odometer counts fewer kilometres than you have actually driven. A smaller diameter does the opposite."
            }
          },
          {
            "@type": "Question",
            "name": "What is plus-sizing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Plus-sizing means fitting a larger wheel and a lower-profile tyre so the overall diameter stays roughly the same, for example 205/55 R16 to 225/45 R17. You get sharper steering response at the cost of a firmer ride and more risk of kerbing a rim."
            }
          }
        ]
      }
